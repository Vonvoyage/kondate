<head>

<title>献立アプリ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #f2f2f7;
  --card: #ffffff;
  --text: #000000;
  --text2: #3c3c43;
  --text3: #8e8e93;
  --border: #e0e0e0;
  --blue: #007AFF;
  --green: #34C759;
  --orange: #FF9500;
  --red: #FF3B30;
  --teal-bg: #E1F5EE; --teal-text: #085041;
  --amber-bg: #FAEEDA; --amber-text: #854F0B;
  --blue-bg: #E6F1FB; --blue-text: #0C447C;
  --green-bg: #E9F8EF; --green-text: #1D7A47;
  --gray-bg: #F1EFE8; --gray-text: #5F5E5A;
  --pink-bg: #FBEAF0; --pink-text: #72243E;
  --mint-bg: #EAF3DE; --mint-text: #27500A;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#1c1c1e; --card:#2c2c2e; --text:#ffffff; --text2:#ebebf5;
    --text3:#8e8e93; --border:#38383a;
    --teal-bg:#0a3d2e; --teal-text:#5dcaa5;
    --amber-bg:#3d2800; --amber-text:#EF9F27;
    --blue-bg:#001f3d; --blue-text:#85b7eb;
    --green-bg:#1a3a1a; --green-text:#97C459;
    --gray-bg:#2a2a2a; --gray-text:#B4B2A9;
    --pink-bg:#3a1020; --pink-text:#ED93B1;
    --mint-bg:#1a2a10; --mint-text:#C0DD97;
  }
}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;background:var(--bg);color:var(--text)}
#app{display:flex;flex-direction:column;height:100%;padding-top:var(--safe-top)}
.topbar{background:var(--card);border-bottom:0.5px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:8px;flex-shrink:0}
.topbar-title{font-size:17px;font-weight:600;flex:1}
.wswitch{display:flex;border:0.5px solid var(--border);border-radius:8px;overflow:hidden}
.wsb{padding:5px 12px;font-size:12px;font-weight:500;cursor:pointer;background:var(--card);color:var(--text3);border:none}
.wsb.on{background:var(--blue);color:#fff}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.tabbar{background:var(--card);border-top:0.5px solid var(--border);display:flex;padding:8px 0;padding-bottom:calc(8px + var(--safe-bottom));flex-shrink:0}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:4px 0}
.tab .ti{font-size:22px;line-height:1}
.tab .tl{font-size:10px;color:var(--text3)}
.tab.active .tl{color:var(--blue)}
.pg{display:none}.pg.on{display:block;padding-bottom:16px}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:10px 10px 6px}
.dc{background:var(--card);border-radius:10px;padding:6px 2px;text-align:center;cursor:pointer;border:1.5px solid transparent;position:relative}
.dc.sel{border-color:var(--blue)}
.dc.today-c{background:var(--blue-bg)}
.dc.today-c .dd{color:var(--blue)}
.dn{font-size:9px;color:var(--text3);line-height:1.4}
.dd{font-size:15px;font-weight:600;color:var(--text);line-height:1.2}
.daydot{width:5px;height:5px;border-radius:50%;margin:3px auto 0}
.today-pip{position:absolute;top:-7px;left:50%;transform:translateX(-50%);background:var(--blue);color:#fff;font-size:7px;padding:1px 4px;border-radius:4px;white-space:nowrap}
.ev-banner{margin:0 10px 6px;background:var(--card);border-radius:10px;padding:8px 12px;display:flex;align-items:center;gap:8px;border:0.5px solid var(--border)}
.nwn{margin:0 10px 8px;background:var(--mint-bg);border-radius:10px;padding:9px 12px;border:0.5px solid #C0DD97}
.nwn-t{font-size:13px;font-weight:500;color:var(--mint-text);margin-bottom:2px}
.nwn-s{font-size:11px;color:var(--mint-text);opacity:.8}
.sp{padding:0 10px}
.mb{background:var(--card);border-radius:14px;margin-bottom:10px;overflow:hidden}
.mh{padding:12px 14px 7px}
.mt{font-size:11px;font-weight:600;color:var(--text3);letter-spacing:.4px;text-transform:uppercase;margin-bottom:2px}
.mn{font-size:15px;font-weight:500;color:var(--text);margin-bottom:5px}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:11px;padding:2px 7px;border-radius:20px}
.tp{background:var(--pink-bg);color:var(--pink-text)}
.tg{background:var(--gray-bg);color:var(--gray-text)}
.tw{background:var(--teal-bg);color:var(--teal-text)}
.dev-row{display:flex;gap:4px;flex-wrap:wrap;padding:5px 14px 8px}
.dchip{display:inline-flex;align-items:center;gap:3px;border-radius:6px;padding:2px 7px;font-size:11px}
.link-banner{background:var(--amber-bg);padding:7px 14px;display:flex;align-items:center;gap:6px;border-top:0.5px solid rgba(186,116,23,.3)}
.link-text{font-size:12px;color:var(--amber-text);flex:1;line-height:1.4}
.soup-tog{background:var(--teal-bg);padding:8px 14px;border-top:0.5px solid rgba(29,158,117,.3);display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.soup-lbl{font-size:13px;color:var(--teal-text);display:flex;align-items:center;gap:5px;font-weight:500}
.soup-body{padding:10px 14px 12px;background:var(--teal-bg);display:none}
.soup-body.on{display:block}
.soup-step{font-size:13px;color:var(--teal-text);line-height:1.6;padding-left:12px;position:relative;margin-bottom:3px}
.soup-step::before{content:'·';position:absolute;left:3px;color:#1D9E75}
.soup-dev{font-size:11px;font-weight:600;padding:2px 7px;border-radius:20px;display:inline-block;margin-bottom:6px}
.svrow{display:flex;border-top:0.5px solid var(--border)}
.svseg{flex:1;padding:8px 8px;border-right:0.5px solid var(--border);display:flex;flex-direction:column;align-items:center}
.svseg:last-child{border-right:none}
.svlbl{font-size:10px;color:var(--text3);margin-bottom:2px}
.svctrl{display:flex;align-items:center;gap:5px}
.svbtn{width:26px;height:26px;border-radius:50%;border:1px solid var(--border);background:none;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--blue);font-weight:500}
.svnum{font-size:15px;font-weight:600;color:var(--text);min-width:16px;text-align:center}
.rt{padding:9px 14px;border-top:0.5px solid var(--border);font-size:13px;color:var(--blue);cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.rb{padding:12px 14px 14px;border-top:0.5px solid var(--border);display:none}
.rb.on{display:block}
.rl{font-size:11px;font-weight:600;color:var(--text3);letter-spacing:.4px;text-transform:uppercase;margin-bottom:8px}
.step{display:flex;gap:8px;margin-bottom:7px;align-items:flex-start}
.sn0{width:20px;height:20px;border-radius:50%;background:var(--bg);font-size:11px;font-weight:600;color:var(--text2);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.st{font-size:13px;color:var(--text);line-height:1.55;flex:1}
.bento-hd{background:var(--amber-bg);padding:10px 14px;border-top:0.5px solid rgba(186,116,23,.3);display:flex;justify-content:space-between;cursor:pointer;align-items:center}
.bento-tl{font-size:13px;font-weight:500;color:var(--amber-text);display:flex;align-items:center;gap:5px}
.bento-bd{padding:9px 14px 12px;background:var(--amber-bg);display:none}
.bento-bd.on{display:block}
.bstep{font-size:13px;color:var(--amber-text);line-height:1.6;padding-left:12px;position:relative;margin-bottom:3px}
.bstep::before{content:'·';position:absolute;left:3px}
.pfc-card{background:var(--card);border-radius:14px;margin-bottom:10px;padding:14px}
.pfc-card-title{font-size:11px;font-weight:600;color:var(--text3);letter-spacing:.4px;text-transform:uppercase;margin-bottom:10px}
.pfc-bar-big{display:flex;height:10px;border-radius:5px;overflow:hidden;margin-bottom:7px}
.pfc-pcts{display:flex;gap:10px;margin-bottom:12px}
.pfc-pct{font-size:12px}
.pfc-rows{display:flex;flex-direction:column;gap:7px}
.pfc-row{display:flex;align-items:center;gap:8px}
.pfc-lbl{font-size:12px;color:var(--text);width:72px}
.pfc-trk{flex:1;height:6px;background:var(--bg);border-radius:3px;overflow:hidden}
.pfc-fil{height:100%;border-radius:3px}
.pfc-val{font-size:11px;color:var(--text3);text-align:right;min-width:64px}
.prep-intro{background:var(--mint-bg);border-radius:12px;padding:12px 14px;margin-bottom:12px;border:0.5px solid #C0DD97}
.prep-intro-title{font-size:14px;font-weight:500;color:var(--mint-text);margin-bottom:4px}
.prep-intro-sub{font-size:12px;color:var(--mint-text);opacity:.9;line-height:1.6}
.prep-stat-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.prep-stat{background:var(--card);border-radius:10px;padding:10px;text-align:center}
.prep-stat-num{font-size:20px;font-weight:500;color:var(--text)}
.prep-stat-lbl{font-size:10px;color:var(--text3);margin-top:2px}
.prep-card{background:var(--card);border-radius:14px;margin-bottom:10px;overflow:hidden}
.prep-head{padding:12px 14px 10px;display:flex;align-items:flex-start;gap:10px}
.prep-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;background:var(--bg)}
.prep-info{flex:1}
.prep-name{font-size:15px;font-weight:500;color:var(--text);margin-bottom:3px}
.prep-meta{font-size:12px;color:var(--text3)}
.prep-uses{display:flex;gap:5px;flex-wrap:wrap;padding:0 14px 10px}
.prep-use-tag{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--blue-bg);color:var(--blue-text)}
.prep-recipe-tog{padding:9px 14px;border-top:0.5px solid var(--border);font-size:13px;color:var(--blue);cursor:pointer;display:flex;justify-content:space-between}
.prep-recipe-body{padding:12px 14px 14px;border-top:0.5px solid var(--border);display:none}
.prep-recipe-body.on{display:block}
.prep-step{display:flex;gap:7px;margin-bottom:6px;align-items:flex-start}
.prep-sn{width:19px;height:19px;border-radius:50%;background:var(--bg);font-size:11px;font-weight:600;color:var(--text2);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.prep-st{font-size:13px;color:var(--text);line-height:1.5;flex:1}
.plan-card{background:var(--card);border-radius:14px;margin-bottom:10px;overflow:hidden}
.plan-head{padding:12px 14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.plan-title{font-size:14px;font-weight:500;color:var(--text)}
.plan-sub{font-size:12px;color:var(--text3);margin-top:1px}
.plan-body{padding:0 14px 12px;display:none}
.plan-body.on{display:block}
.plan-item{padding:6px 0;border-bottom:0.5px solid var(--border);font-size:13px;color:var(--text);display:flex;align-items:flex-start;gap:6px;line-height:1.5}
.plan-item:last-child{border-bottom:none}
.plan-dot{width:6px;height:6px;border-radius:50%;background:#1D9E75;margin-top:5px;flex-shrink:0}
.shop-wtabs{display:flex;gap:8px;margin-bottom:12px;padding:12px 12px 0}
.swt{flex:1;padding:9px;background:var(--card);border-radius:10px;text-align:center;cursor:pointer;border:1.5px solid transparent;font-size:13px;font-weight:500;color:var(--text3)}
.swt.on{border-color:var(--blue);color:var(--blue)}
.price-card{background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;margin:0 12px 12px}
.pc-price{font-size:22px;font-weight:500;color:var(--text)}
.pc-sub{font-size:11px;color:var(--text3);margin-top:1px}
.shop-body{padding:0 12px}
.sc{font-size:12px;font-weight:600;color:var(--text3);letter-spacing:.4px;text-transform:uppercase;margin-bottom:5px}
.si{background:var(--card);border-radius:10px;padding:11px 13px;display:flex;align-items:center;gap:8px;margin-bottom:5px;cursor:pointer;-webkit-user-select:none}
.ck{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;transition:all .15s}
.ck.on{background:var(--green);border-color:var(--green)}
.sn2{font-size:14px;color:var(--text);flex:1}
.sn2.done{text-decoration:line-through;color:var(--text3)}
.sq{font-size:12px;color:var(--text3);margin-right:4px}
.sprice{font-size:12px;color:var(--blue);white-space:nowrap}
.nw{padding:12px}
.nc{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px}
.nh{font-size:14px;font-weight:500;color:var(--text);margin-bottom:11px}
.pfc-ring-wrap{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.pfc-legend{display:flex;flex-direction:column;gap:7px;flex:1}
.pfc-leg-row{display:flex;align-items:center;gap:7px}
.pfc-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.nrow{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.nlbl{font-size:13px;color:var(--text);width:72px}
.ntrk{flex:1;height:7px;background:var(--bg);border-radius:4px;overflow:hidden}
.nfil{height:100%;border-radius:4px}
.nval{font-size:12px;color:var(--text3);width:40px;text-align:right}
.ntgt{font-size:11px;color:var(--text3);opacity:.5;width:36px;text-align:right}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <span class="topbar-title" id="nav-t">今週の献立</span>
    <div class="wswitch">
      <div class="wsb on" id="wb0" onclick="switchWeek(0)">今週</div>
      <div class="wsb" id="wb1" onclick="switchWeek(1)">来週</div>
    </div>
  </div>
  <div class="content" id="content">

        <div class="swt" id="nwt1" onclick="switchNutriWeek(1)">来週</div>
      </div>
      <div class="nw" id="nutri-inner"></div>

  </div>
  <div class="tabbar">
    <div class="tab active" id="t-menu" onclick="sw('menu','献立')"><span class="ti">🗓</span><span class="tl">献立</span></div>

    <div class="tab" id="t-shop" onclick="sw('shop','買い物')"><span class="ti">🛒</span><span class="tl">買い物</span></div>
    <div class="tab" id="t-nutri" onclick="sw('nutri','栄養')"><span class="ti">📊</span><span class="tl">栄養</span></div>
  </div>
</div>

<script>
const now=new Date();
const month=now.getMonth()+1;
const todayDow=now.getDay();
const todayDate=now.getDate();
const isFriEve=(todayDow===5&&now.getHours()>=17)||todayDow===6||todayDow===0;
const DAYS=['月','火','水','木','金','土','日'];
const WE=[5,6];
const PFC_C={p:'#378ADD',f:'#FF9500',c:'#34C759'};
const DC_STYLE={'ホットクック':{bg:'#E9F8EF',color:'#1D7A47'},'ヘルシオ':{bg:'#FAEEDA',color:'#854F0B'},'レンジ':{bg:'#E6F1FB',color:'#0C447C'}};

function getMon(off=0){const d=new Date(now);const dw=d.getDay();d.setDate(d.getDate()+(dw===0?-6:1-dw)+off*7);d.setHours(0,0,0,0);return d;}
function getSeason(){return month>=3&&month<=5?'spring':month>=6&&month<=8?'summer':month>=9&&month<=11?'autumn':'winter';}
const season=getSeason();
// 絶対週番号（2025-01-06月曜日を基準）でローテーション
const EPOCH_MON=new Date(2025,0,6);
function getAbsWeek(wk){return Math.round((getMon(wk)-EPOCH_MON)/(7*24*60*60*1000));}

// ── スープDB（ingフィールド追加：1人分の食材） ──
const SOUPS={

    recipe:['内鍋に水400ml・顆粒だし小さじ1/2・角切り豆腐を入れる','ホットクック「スープ」モードで沸かす（タイマー予約可）','わかめを加えみそを溶き入れ保温に切り替えて完成']},
  hc_negi_daikon:{name:'大根とねぎのみそ汁',device:'ホットクック',
    ing:[{cat:'野菜・きのこ',n:'大根',amt:60,unit:'g',price:18},{cat:'野菜・きのこ',n:'長ねぎ',amt:20,unit:'g',price:14}],
    recipe:['大根薄切り・ねぎ小口切りを内鍋へ','水400ml・顆粒だしでホットクック「スープ」8分','みそを溶き入れ完成']},
  hc_nameko_tofu:{name:'なめこと豆腐のみそ汁',device:'ホットクック',
    ing:[{cat:'汁物食材',n:'なめこ',amt:30,unit:'g',price:22},{cat:'汁物食材',n:'豆腐（絹）',amt:80,unit:'g',price:20}],
    recipe:['なめこ・角切り豆腐を内鍋へ','水400ml・顆粒だしでホットクック「スープ」6分','みそを溶き入れ完成']},
  hc_kinoko:{name:'きのこと豆腐のみそ汁',device:'ホットクック',
    ing:[{cat:'野菜・きのこ',n:'しめじ',amt:30,unit:'g',price:20},{cat:'汁物食材',n:'豆腐（絹）',amt:60,unit:'g',price:15}],
    recipe:['しめじ・豆腐を内鍋へ','水400ml・顆粒だしでホットクック「スープ」8分','みそを溶き入れ小ねぎを散らす']},
  hc_consomme:{name:'コンソメ野菜スープ',device:'ホットクック',
    ing:[{cat:'野菜・きのこ',n:'玉ねぎ',amt:40,unit:'g',price:18},{cat:'野菜・きのこ',n:'にんじん',amt:20,unit:'g',price:10}],
    recipe:['薄切り玉ねぎ・にんじんを内鍋へ','水400ml・コンソメでホットクック「スープ」10分','塩こしょうで調整']},
  hc_corn:{name:'中華風コーンスープ',device:'ホットクック',

    recipe:['コーン缶汁ごと・水300ml・中華だしを内鍋へ','ホットクック「スープ」5分で温める','水溶き片栗粉でとろみ→溶き卵を流し入れ「スープ」2分']},

function getWeekDates(off){const m=getMon(off);return DAYS.map((_,i)=>{const d=new Date(m);d.setDate(m.getDate()+i);return d;});}
function getTodayIdx(off){return getWeekDates(off).findIndex(d=>d.getDate()===todayDate&&d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear());}
function getDinners(wk){
  const src=dinnerDB[season]; // 14 dishes (A×7 + B×7)
  const half=7;
  const off=getAbsWeek(wk);
  const grp=(off%2)*half;           // 0=セットA (偶数週), 7=セットB (奇数週)
  const rot=Math.floor(off/2)%half; // 2週ごとに1ずつシフト
  return DAYS.map((_,i)=>src[grp+(i+rot)%half]);
}
function getLunchSrc(wk,di){
  if(WE.includes(di))return null;
  if(wk===1&&di===0){const d0=getDinners(0);return{din:d0[6],fromLabel:`今週日曜の夕飯「${d0[6].name}」の残りを活用`};}
  const dins=getDinners(wk);const pi=(di+6)%7;
  return{din:dins[pi],fromLabel:`前日（${DAYS[pi]}）の夕飯「${dins[pi].name}」の残りを活用`};
}
function dayPFC(wk,di){
  const bf=breakfasts[di],dins=getDinners(wk),din=dins[di];
  const ls=getLunchSrc(wk,di),wl=WE.includes(di)?wkLunches[di-5]:null;
  const lP=ls?Math.round(ls.din.p*0.6):wl?wl.p:0;
  const lF=ls?Math.round(ls.din.f*0.6):wl?wl.f:0;
  const lC=ls?Math.round(ls.din.c*0.6):wl?wl.c:0;
  const p=bf.p+lP+din.p,f=bf.f+lF+din.f,c=bf.c+lC+din.c,t=p+f+c;
  const pPct=Math.round(p/t*100),fPct=Math.round(f/t*100),cPct=100-Math.round(p/t*100)-Math.round(f/t*100);
  return{p,f,c,pPct,fPct,cPct};
}
function tog(id){

// ── 買い物リスト動的生成 ──────────────────────────────
function fmtQty(amt,unit){
  if(unit==='g')return Math.round(amt/10)*10+'g';
  return Math.ceil(amt)+unit;
}

function getShopItems(wk){
  const dins=getDinners(wk);
  const acc={}; // key=itemName → {cat,n,unit,totalAmt,totalPrice}
  function add(cat,n,amt,unit,price,sv){
    if(!acc[n])acc[n]={cat,n,unit,totalAmt:0,totalPrice:0};
    acc[n].totalAmt+=amt*sv;
    acc[n].totalPrice+=price*sv;
  }
  DAYS.forEach((_,di)=>{
    const sv=servD[wk][di];
    const din=dins[di];
    const bf=breakfasts[di];
    // 夕食の食材
    if(din.ing)din.ing.forEach(ig=>add(ig.cat,ig.n,ig.amt,ig.unit,ig.price,sv.d));
    // スープの食材（夕食と同じ人数）
    if(din.soupKey&&SOUPS[din.soupKey].ing)
      SOUPS[din.soupKey].ing.forEach(ig=>add(ig.cat,ig.n,ig.amt,ig.unit,ig.price,sv.d));
    // 朝食の食材
    if(bf.ing)bf.ing.forEach(ig=>add(ig.cat,ig.n,ig.amt,ig.unit,ig.price,sv.b));
    // 週末ランチの食材
    if(WE.includes(di)){
      const wl=wkLunches[di-5];
      if(wl.ing)wl.ing.forEach(ig=>add(ig.cat,ig.n,ig.amt,ig.unit,ig.price,sv.l));
    }
  });
  const catOrder=['肉・魚','野菜・きのこ','汁物食材','その他'];
  const grouped={};catOrder.forEach(c=>{grouped[c]=[];});
  Object.values(acc).forEach(item=>{
    const c=catOrder.includes(item.cat)?item.cat:'その他';
    grouped[c].push({
      n:item.n,
      q:fmtQty(item.totalAmt,item.unit),
      price:Math.round(item.totalPrice),
      done:shopDone[wk][item.n]||false
    });
  });
  return catOrder.map(c=>({cat:c,items:grouped[c]})).filter(c=>c.items.length>0);
}

function buildPFCCard(wk,di){
  const pfc=dayPFC(wk,di);
  const kcalEst=Math.round(pfc.p*4+pfc.f*9+pfc.c*4);
  return`<div class="pfc-card">
    <div class="pfc-card-title">今日の PFC バランス（1人分）</div>
    <div class="pfc-bar-big">
      <div style="width:${pfc.pPct}%;background:${PFC_C.p};height:100%"></div>
      <div style="width:${pfc.fPct}%;background:${PFC_C.f};height:100%"></div>
      <div style="width:${pfc.cPct}%;background:${PFC_C.c};height:100%"></div>
    </div>
    <div class="pfc-pcts">
      <span class="pfc-pct" style="color:#0C447C">P ${pfc.pPct}%</span>
      <span class="pfc-pct" style="color:#854F0B">F ${pfc.fPct}%</span>
      <span class="pfc-pct" style="color:#1D7A47">C ${pfc.cPct}%</span>
      <span class="pfc-pct" style="color:var(--text3);margin-left:auto">${kcalEst} kcal</span>
    </div>
    <div class="pfc-rows">
      ${pfcRow('たんぱく質',PFC_C.p,pfc.p,80)}
      ${pfcRow('脂質',PFC_C.f,pfc.f,65)}
      ${pfcRow('炭水化物',PFC_C.c,pfc.c,300)}
    </div>
  </div>`;
}
function pfcRow(label,color,val,max){
  const pct=Math.min(100,Math.round(val/max*100));
  return`<div class="pfc-row"><div class="pfc-lbl">${label}</div><div class="pfc-trk"><div class="pfc-fil" style="width:${pct}%;background:${color}"></div></div><div class="pfc-val">${val}g / ${max}g</div></div>`;
}

function sn(d){return d.name.replace(/ホットクック |ヘルシオ /g,'');}

// 今週の献立に基づいて仕込みポイントを生成
function getPrepTips(wk){
  const dins=getDinners(wk);
  const tips=[];
  const withIdx=dins.map((d,i)=>({d,i}));
  // 鶏料理のある曜日
  const chickenDays=withIdx.filter(({d})=>(d.ing||[]).some(ig=>ig.n.includes('鶏')));
  if(chickenDays.length>=2){
    const ref=chickenDays.slice(0,2).map(({d,i})=>`${DAYS[i]}の「${sn(d)}」`).join('と');
    tips.push({icon:'🍗',text:`${ref}など鶏料理が${chickenDays.length}日。サラダチキンを多めに仕込んで弁当・朝食のたんぱく源に活用しましょう。`});
  } else if(chickenDays.length===1){
    const {d,i}=chickenDays[0];
    tips.push({icon:'🍗',text:`${DAYS[i]}の「${sn(d)}」に合わせてサラダチキンを仕込んでおくと翌日の弁当のたんぱく源になります。`});
  }
  // 魚料理のある曜日
  const fishDays=withIdx.filter(({d})=>(d.ing||[]).some(ig=>['サーモン','鯛','鮭','アサリ'].some(f=>ig.n.includes(f))));
  if(fishDays.length>0){
    const {d,i}=fishDays[0];
    tips.push({icon:'🐟',text:`${DAYS[i]}の「${sn(d)}」がある週。ブロッコリー蒸しを仕込んでおくと緑の副菜として彩りよく添えられます。`});
  }
  // 根菜を使う曜日
  const roots=['大根','にんじん','じゃがいも','さつまいも'];
  const rootDays=withIdx.filter(({d})=>(d.ing||[]).some(ig=>roots.some(r=>ig.n.includes(r))));
  if(rootDays.length>=2){
    const ref=rootDays.slice(0,2).map(({i})=>DAYS[i]).join('・');
    tips.push({icon:'🥕',text:`${ref}に根菜を使う夕食があります。ヘルシオで根菜をまとめてローストしておくと両日の副菜として使い回せます。`});
  }
  // 牛肉のある曜日
  const beefDays=withIdx.filter(({d})=>(d.ing||[]).some(ig=>ig.n.includes('牛')));
  if(beefDays.length>0&&tips.length<3){
    const {d,i}=beefDays[0];
    tips.push({icon:'🥩',text:`${DAYS[i]}の「${sn(d)}」は豪華な夕食。煮卵・切り干し大根を仕込んでおくと副菜の心配がなくなります。`});
  }
  if(tips.length===0)tips.push({icon:'🥚',text:'煮卵と切り干し大根は毎週仕込むと弁当が充実します。月曜と木曜の弁当のたんぱく源に。'});
  return tips.slice(0,3);
}

// 今週の献立に合わせてスコアが高い上位5品を自動選出し、活用例も生成
function getWeeklyPrepItems(wk){
  const dins=getDinners(wk);
  const withIdx=dins.map((d,i)=>({d,i}));
  const wkdayWithIdx=withIdx.filter(({i})=>!WE.includes(i));

  // 各プールアイテムをスコアリングして上位5品選出
  const scored=prepItemsPool.map(item=>({...item,_score:item.score(dins)}));
  scored.sort((a,b)=>b._score-a._score);
  const selected=scored.slice(0,5);

  // 各アイテムの「活用例」をこの週の献立に合わせて動的生成
  return selected.map(item=>{
    const uses=[];
    if(item.id==='chicken'){
      const ck=wkdayWithIdx.filter(({d})=>(d.ing||[]).some(ig=>ig.n.includes('鶏')));
      uses.push(ck.length>0?`${DAYS[ck[0].i]}「${sn(ck[0].d)}」弁当のたんぱく源に`:'平日弁当のたんぱく源に');
      if(ck.length>1)uses.push(`${DAYS[ck[1].i]}「${sn(ck[1].d)}」にもそのまま活用`);
      uses.push('朝食のトッピング・夜のサラダに');
    } else if(item.id==='rootveg'){
      const roots=['大根','にんじん','じゃがいも','さつまいも','ごぼう','里芋','長芋'];
      const rd=withIdx.filter(({d})=>(d.ing||[]).some(ig=>roots.some(r=>ig.n.includes(r))));
      uses.push(rd.length>0?`${DAYS[rd[0].i]}「${sn(rd[0].d)}」の副菜・付け合わせに`:'弁当の副菜に');
      if(rd.length>1)uses.push(`${DAYS[rd[1].i]}夕飯の付け合わせにも使い回し`);
      uses.push('週後半の弁当の彩りに');
    } else if(item.id==='egg'){
      uses.push(`${DAYS[wkdayWithIdx[0].i]}・${DAYS[wkdayWithIdx[1].i]}の弁当おかずに`);
      uses.push('朝ご飯のたんぱく補給に');
      uses.push('小腹が空いたときの間食に');
    } else if(item.id==='kiriboshi'){
      const fish=['サーモン','鯛','鮭','さんま','鯖','あじ','たら'];
      const fd=withIdx.filter(({d})=>(d.ing||[]).some(ig=>fish.some(f=>ig.n.includes(f))));
      uses.push(fd.length>0?`${DAYS[fd[0].i]}「${sn(fd[0].d)}」に合う和の副菜に`:'弁当の副菜に');
      uses.push('夕飯のご飯のお供に');
      uses.push('週後半の常備菜として');
    } else if(item.id==='broccoli'){
      const fd=withIdx.filter(({d})=>(d.ing||[]).some(ig=>['サーモン','鯛','鮭'].some(f=>ig.n.includes(f))));
      uses.push(fd.length>0?`${DAYS[fd[0].i]}「${sn(fd[0].d)}」の付け合わせに`:'弁当の緑の副菜に');
      uses.push('朝食の付け合わせに');
      uses.push('サラダのトッピングに');
    } else if(item.id==='pork'){
      const pk=withIdx.filter(({d})=>(d.ing||[]).some(ig=>['豚バラ','豚ロース','豚ひき'].some(p=>ig.n.includes(p))));
      uses.push(pk.length>0?`${DAYS[pk[0].i]}「${sn(pk[0].d)}」が朝は詰めるだけに`:'豚料理の下準備に');
      if(pk.length>1)uses.push(`${DAYS[pk[1].i]}「${sn(pk[1].d)}」も前日漬けでOK`);
      uses.push('漬けておくと味がしっかり染みる');
    } else if(item.id==='kinoko'){
      const kk=withIdx.filter(({d})=>{const ks=['しめじ','まいたけ','えのき','エリンギ','なめこ'];return(d.ing||[]).some(ig=>ks.some(k=>ig.n.includes(k)));});
      uses.push(kk.length>0?`${DAYS[kk[0].i]}「${sn(kk[0].d)}」の副菜に`:'弁当の副菜に');
      if(kk.length>1)uses.push(`${DAYS[kk[1].i]}夕飯にも使い回し`);
      uses.push('みそ汁の具材やパスタにも');
    } else if(item.id==='leafy'){
      const lf=withIdx.filter(({d})=>{const ls=['ほうれん草','小松菜','菜の花','春キャベツ','キャベツ'];return(d.ing||[]).some(ig=>ls.some(l=>ig.n.includes(l)));});
      uses.push(lf.length>0?`${DAYS[lf[0].i]}「${sn(lf[0].d)}」の付け合わせに`:'弁当の緑の副菜に');
      if(lf.length>1)uses.push(`${DAYS[lf[1].i]}夕飯の副菜にも使い回し`);
      uses.push('朝食のおひたしに');
    }
    return {...item, uses};
  });
}

// ── 栄養 ──────────────────────────────────────────────
function buildNutri(){
  const wk=nutriWeek,dins=getDinners(wk);
  const weekP=Math.round(dins.reduce((s,d)=>s+d.p,0)/7+breakfasts.reduce((s,b)=>s+b.p,0)/7+10);
  const weekF=Math.round(dins.reduce((s,d)=>s+d.f,0)/7+breakfasts.reduce((s,b)=>s+b.f,0)/7+8);
  const weekC=Math.round(dins.reduce((s,d)=>s+d.c,0)/7+breakfasts.reduce((s,b)=>s+b.c,0)/7+30);
  const tG=weekP+weekF+weekC;
  const pPct=Math.round(weekP/tG*100),fPct=Math.round(weekF/tG*100),cPct=100-pPct-fPct;
  // 1日ごとのkcal（1人分）
  const dayKcals=DAYS.map((_,i)=>{
    const ls=getLunchSrc(wk,i);
    const lk=ls?Math.round(ls.din.kcal*0.6):WE.includes(i)?wkLunches[i-5].kcal:0;
    return breakfasts[i].kcal+lk+dins[i].kcal;
  });
  const avgK=Math.round(dayKcals.reduce((s,k)=>s+k,0)/7);
  const maxK=Math.max(...dayKcals);
  const sz=88,cx=44,cy=44,r=30,sw2=10;
  function arc(pct,off,col){const c2=2*Math.PI*r,da=pct/100*c2,ga=c2-da,ro=-90+off*360/100;return`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${col}" stroke-width="${sw2}" stroke-dasharray="${da.toFixed(1)} ${ga.toFixed(1)}" transform="rotate(${ro} ${cx} ${cy})" stroke-linecap="round"/>`;}
  document.getElementById('nutri-inner').innerHTML=`
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
      <div style="background:var(--card);border-radius:10px;padding:12px;text-align:center">
        <div style="font-size:11px;color:var(--text3);margin-bottom:3px">週平均 1日</div>
        <div style="font-size:26px;font-weight:500;color:var(--text)">${avgK}</div>
        <div style="font-size:11px;color:var(--text3)">kcal / 人</div>
      </div>
      <div style="background:var(--card);border-radius:10px;padding:12px;text-align:center">
        <div style="font-size:11px;color:var(--text3);margin-bottom:3px">弁当活用</div>
        <div style="font-size:26px;font-weight:500;color:var(--green)">5/7日</div>
        <div style="font-size:11px;color:var(--text3)">残り物活用</div>
      </div>
    </div>
    <div class="nc">
      <div class="nh">曜日別カロリー（1人分）</div>
      <div style="display:flex;gap:4px;align-items:flex-end;height:90px;margin-bottom:6px">
        ${DAYS.map((d,i)=>{
          const isWk=WE.includes(i);
          const h=Math.max(6,Math.round(dayKcals[i]/maxK*70));
          const col=isWk?'var(--blue)':'var(--green)';
          return`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px">
            <div style="font-size:8px;color:var(--text3);line-height:1">${dayKcals[i]}</div>
            <div style="width:100%;height:${h}px;background:${col};border-radius:3px 3px 0 0;min-height:6px"></div>
            <div style="font-size:10px;color:${isWk?'var(--blue)':'var(--text3)'};font-weight:${isWk?600:400}">${d}</div>
          </div>`;
        }).join('')}
      </div>
      <div style="display:flex;gap:12px;margin-top:4px">
        <div style="display:flex;align-items:center;gap:4px"><div style="width:8px;height:8px;border-radius:2px;background:var(--green)"></div><span style="font-size:11px;color:var(--text3)">平日</span></div>
        <div style="display:flex;align-items:center;gap:4px"><div style="width:8px;height:8px;border-radius:2px;background:var(--blue)"></div><span style="font-size:11px;color:var(--text3)">週末</span></div>
      </div>
    </div>
    <div class="nc">
      <div class="nh">週平均 PFC（1人・1日）</div>
      <div class="pfc-ring-wrap">
        <svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}">
          <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--bg)" stroke-width="${sw2}"/>
          ${arc(pPct,0,PFC_C.p)}${arc(fPct,pPct,PFC_C.f)}${arc(cPct,pPct+fPct,PFC_C.c)}
          <text x="${cx}" y="${cy+1}" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="var(--text3)">PFC</text>
        </svg>
        <div class="pfc-legend">
          <div class="pfc-leg-row"><div class="pfc-dot" style="background:${PFC_C.p}"></div><span style="font-size:13px;color:var(--text);flex:1">たんぱく質</span><span style="font-size:13px;font-weight:500;color:var(--text)">${weekP}g</span><span style="font-size:11px;color:var(--text3);margin-left:2px">${pPct}%</span></div>
          <div class="pfc-leg-row"><div class="pfc-dot" style="background:${PFC_C.f}"></div><span style="font-size:13px;color:var(--text);flex:1">脂質</span><span style="font-size:13px;font-weight:500;color:var(--text)">${weekF}g</span><span style="font-size:11px;color:var(--text3);margin-left:2px">${fPct}%</span></div>
          <div class="pfc-leg-row"><div class="pfc-dot" style="background:${PFC_C.c}"></div><span style="font-size:13px;color:var(--text);flex:1">炭水化物</span><span style="font-size:13px;font-weight:500;color:var(--text)">${weekC}g</span><span style="font-size:11px;color:var(--text3);margin-left:2px">${cPct}%</span></div>
        </div>
      </div>
    </div>
    <div class="nc">
      <div class="nh">各栄養素（週平均）</div>
      ${nRow('たんぱく質',PFC_C.p,weekP,80)}${nRow('脂質',PFC_C.f,weekF,65)}${nRow('炭水化物',PFC_C.c,weekC,300)}${nRow('食物繊維','#1D9E75',14,18)}
    </div>`;
}
function nRow(l,col,v,max){const p=Math.min(100,Math.round(v/max*100));return`<div class="nrow"><div class="nlbl">${l}</div><div class="ntrk"><div class="nfil" style="width:${p}%;background:${col}"></div></div><div class="nval">${v}g</div><div class="ntgt">/${max}</div></div>`;}
function switchNutriWeek(wk){
  nutriWeek=wk;
  document.getElementById('nwt0').classList.toggle('on',wk===0);
  document.getElementById('nwt1').classList.toggle('on',wk===1);
  buildNutri();
  document.getElementById('content').scrollTop=0;
}

// ── Tab / init ────────────────────────────────────────
function sw(tab,title){
  ['menu','prep','shop','nutri'].forEach(t=>{
    document.getElementById('pg-'+t).classList.toggle('on',t===tab);
    document.getElementById('t-'+t).classList.toggle('active',t===tab);
  });
  document.getElementById('nav-t').textContent=title;
  document.getElementById('content').scrollTop=0;
  if(tab==='shop')buildShop();
  if(tab==='nutri')buildNutri();
  if(tab==='prep')buildPrep();
}

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}

const ti=getTodayIdx(0);
selDay=ti>=0?ti:0;
buildStrip();
buildDay();
</script>
</body>
</html>
